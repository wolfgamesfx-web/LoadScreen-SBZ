<!DOCTYPE html>
<html lang="es">
<head>
	<meta charset="utf-8" />
	<title>Preview</title>
	<link rel="stylesheet" href="style.css" />
</head>
<body>
	<div id="slides"></div>
	<div id="vignette"></div>
	<div id="empty-hint" class="hidden">Agrega al menos una imagen para ver la vista previa</div>

	<audio id="audio" loop muted></audio>

	<div id="tip-bar">
		<div id="tip-text"></div>
	</div>

	<div id="bottom-bar">
		<img id="logo" alt="" />
		<div id="progress-track">
			<div id="progress-fill"></div>
		</div>
		<button id="mute-btn" type="button" title="Probar sonido"></button>
	</div>

	<script src="app.js"></script>
</body>
</html>
